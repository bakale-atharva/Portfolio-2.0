<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="500" fill="#11110F"/>
  <rect width="800" height="500" fill="url(#grid2)"/>

  <!-- Outer Frame -->
  <rect x="40" y="40" width="720" height="420" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Header Bar -->
  <line x1="40" y1="80" x2="760" y2="80" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <circle cx="65" cy="60" r="4" fill="#C7FF3D"/>
  <text x="80" y="64" fill="#F3F0E8" font-family="monospace" font-size="12" letter-spacing="1">PROJECT [02] — HYPERGRID UI SYSTEM</text>
  <text x="680" y="64" fill="#C7FF3D" font-family="monospace" font-size="11" text-anchor="end">ZERO-RUNTIME TOKEN ENGINE</text>

  <!-- Design Token Swatches -->
  <g transform="translate(80, 110)">
    <text x="0" y="0" fill="#66655F" font-family="monospace" font-size="10">COLOR TOKEN PIPELINE</text>
    <rect x="0" y="15" width="80" height="50" fill="#C7FF3D"/>
    <text x="8" y="55" fill="#11110F" font-family="monospace" font-size="9" font-weight="bold">#C7FF3D</text>

    <rect x="90" y="15" width="80" height="50" fill="#F3F0E8"/>
    <text x="98" y="55" fill="#11110F" font-family="monospace" font-size="9" font-weight="bold">#F3F0E8</text>

    <rect x="180" y="15" width="80" height="50" fill="#171715" stroke="rgba(255,255,255,0.3)"/>
    <text x="188" y="55" fill="#F3F0E8" font-family="monospace" font-size="9" font-weight="bold">#171715</text>

    <rect x="270" y="15" width="80" height="50" fill="#66655F"/>
    <text x="278" y="55" fill="#F3F0E8" font-family="monospace" font-size="9" font-weight="bold">#66655F</text>
  </g>

  <!-- Component Tree & Token Graph Diagram -->
  <g transform="translate(80, 210)">
    <rect width="600" height="210" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Token Flow Nodes -->
    <rect x="30" y="40" width="130" height="50" rx="4" fill="#171715" stroke="#C7FF3D" stroke-width="1"/>
    <text x="95" y="63" fill="#C7FF3D" font-family="monospace" font-size="11" text-anchor="middle">Figma Tokens</text>

    <line x1="160" y1="65" x2="230" y2="65" stroke="#C7FF3D" stroke-width="1.5" stroke-dasharray="4 2"/>
    <polygon points="230,60 240,65 230,70" fill="#C7FF3D"/>

    <rect x="240" y="40" width="140" height="50" rx="4" fill="#171715" stroke="#F3F0E8" stroke-width="1"/>
    <text x="310" y="63" fill="#F3F0E8" font-family="monospace" font-size="11" text-anchor="middle">Style Dictionary</text>

    <line x1="380" y1="65" x2="450" y2="65" stroke="#F3F0E8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <polygon points="450,60 460,65 450,70" fill="#F3F0E8"/>

    <rect x="460" y="40" width="110" height="50" rx="4" fill="#C7FF3D"/>
    <text x="515" y="63" fill="#11110F" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Typed React</text>

    <!-- Component Spec Lines -->
    <line x1="30" y1="120" x2="570" y2="120" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    
    <text x="30" y="145" fill="#66655F" font-family="monospace" font-size="10">TOKEN ACCURACY</text>
    <text x="30" y="165" fill="#F3F0E8" font-family="monospace" font-size="14" font-weight="bold">100% Strict Type Safety</text>

    <text x="240" y="145" fill="#66655F" font-family="monospace" font-size="10">BUNDLED OVERHEAD</text>
    <text x="240" y="165" fill="#C7FF3D" font-family="monospace" font-size="14" font-weight="bold">0 KB Runtime Cost</text>

    <text x="460" y="145" fill="#66655F" font-family="monospace" font-size="10">STORYBOOK</text>
    <text x="460" y="165" fill="#F3F0E8" font-family="monospace" font-size="14" font-weight="bold">Auto-Documented</text>
  </g>

  <!-- Footer -->
  <text x="40" y="480" fill="#66655F" font-family="monospace" font-size="10">MULTI-BRAND DESIGN SYSTEM ENGINE</text>
  <text x="760" y="480" fill="#66655F" font-family="monospace" font-size="10" text-anchor="end">REACT / STORYBOOK / TAILWIND</text>
</svg>
