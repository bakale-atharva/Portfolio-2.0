<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid1" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
    <pattern id="dotGrid1" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="rgba(243,240,232,0.15)"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="#11110F"/>

  <!-- Grid Overlays -->
  <rect width="800" height="500" fill="url(#grid1)"/>
  <rect x="40" y="40" width="720" height="420" fill="url(#dotGrid1)"/>

  <!-- Outer Frame -->
  <rect x="40" y="40" width="720" height="420" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Top Technical Header Bar -->
  <line x1="40" y1="80" x2="760" y2="80" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <circle cx="65" cy="60" r="4" fill="#C7FF3D"/>
  <text x="80" y="64" fill="#F3F0E8" font-family="monospace" font-size="12" letter-spacing="1">PROJECT [01] — EDITORIAL CIRCUIT STUDIO</text>
  <text x="680" y="64" fill="#C7FF3D" font-family="monospace" font-size="11" text-anchor="end">[SYS.VER_2026.4]</text>

  <!-- Central Visual Layout Blueprint -->
  <rect x="80" y="110" width="420" height="280" fill="rgba(255,255,255,0.02)" stroke="#F3F0E8" stroke-width="1" stroke-dasharray="4 4"/>
  <rect x="100" y="130" width="220" height="120" fill="rgba(199,255,61,0.05)" stroke="#C7FF3D" stroke-width="1.5"/>

  <!-- Kinetic Typography Abstract Layers -->
  <text x="115" y="170" fill="#C7FF3D" font-family="sans-serif" font-weight="900" font-size="32" letter-spacing="-1">EDITORIAL</text>
  <text x="115" y="210" fill="#F3F0E8" font-family="sans-serif" font-weight="900" font-size="32" letter-spacing="-1">CIRCUIT</text>

  <!-- Wireframe Cards & Modular Panels -->
  <rect x="100" y="270" width="180" height="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <rect x="290" y="270" width="190" height="100" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="110" y1="290" x2="260" y2="290" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <line x1="110" y1="310" x2="220" y2="310" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <line x1="110" y1="325" x2="240" y2="325" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>

  <!-- Side Technical Inspection Panel -->
  <rect x="520" y="110" width="200" height="320" fill="#171715" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <text x="540" y="140" fill="#66655F" font-family="monospace" font-size="10">FRAMEWORK</text>
  <text x="540" y="158" fill="#F3F0E8" font-family="monospace" font-size="13" font-weight="bold">Next.js 16 (App Router)</text>
  
  <line x1="540" y1="175" x2="700" y2="175" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="540" y="195" fill="#66655F" font-family="monospace" font-size="10">STYLES &amp; ANIMATION</text>
  <text x="540" y="213" fill="#F3F0E8" font-family="monospace" font-size="13" font-weight="bold">Tailwind v4 / Motion</text>

  <line x1="540" y1="230" x2="700" y2="230" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <text x="540" y="250" fill="#66655F" font-family="monospace" font-size="10">SYSTEM STATUS</text>
  <rect x="540" y="262" width="12" height="12" fill="#C7FF3D"/>
  <text x="560" y="273" fill="#C7FF3D" font-family="monospace" font-size="12">100% PRODUCTION</text>

  <!-- Crosshair Accents -->
  <path d="M 520 400 L 520 420 M 510 410 L 530 410" stroke="#C7FF3D" stroke-width="1.5"/>
  <path d="M 80 400 L 80 420 M 70 410 L 90 410" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- Footer Info Line -->
  <text x="40" y="480" fill="#66655F" font-family="monospace" font-size="10">LATITUDE 19.0760 N / LONGITUDE 72.8777 E</text>
  <text x="760" y="480" fill="#66655F" font-family="monospace" font-size="10" text-anchor="end">FIGMA -&gt; CODE PIPELINE</text>
</svg>
