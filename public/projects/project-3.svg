<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
    <linearGradient id="chartGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C7FF3D" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C7FF3D" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="#11110F"/>
  <rect width="800" height="500" fill="url(#grid3)"/>

  <!-- Outer Frame -->
  <rect x="40" y="40" width="720" height="420" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Header Bar -->
  <line x1="40" y1="80" x2="760" y2="80" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <circle cx="65" cy="60" r="4" fill="#C7FF3D"/>
  <text x="80" y="64" fill="#F3F0E8" font-family="monospace" font-size="12" letter-spacing="1">PROJECT [03] — PULSE FINANCIAL DASHBOARD</text>
  <text x="680" y="64" fill="#C7FF3D" font-family="monospace" font-size="11" text-anchor="end">WEBSOCKET TELEMETRY</text>

  <!-- Live Market Telemetry Waveform -->
  <g transform="translate(80, 110)">
    <!-- Chart Background Panel -->
    <rect width="600" height="240" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    
    <!-- Grid lines inside chart -->
    <line x1="0" y1="60" x2="600" y2="60" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="0" y1="120" x2="600" y2="120" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <line x1="0" y1="180" x2="600" y2="180" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Waveform Area fill & stroke -->
    <path d="M 0 160 Q 60 140, 120 180 T 240 100 T 360 130 T 480 60 T 600 90 L 600 240 L 0 240 Z" fill="url(#chartGrad)"/>
    <path d="M 0 160 Q 60 140, 120 180 T 240 100 T 360 130 T 480 60 T 600 90" fill="none" stroke="#C7FF3D" stroke-width="2.5"/>

    <!-- Secondary comparison line -->
    <path d="M 0 190 Q 90 170, 180 200 T 360 160 T 540 120 T 600 140" fill="none" stroke="#F3F0E8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

    <!-- Highlighted Active Point -->
    <circle cx="480" cy="60" r="6" fill="#C7FF3D"/>
    <circle cx="480" cy="60" r="12" fill="none" stroke="#C7FF3D" stroke-width="1" opacity="0.6"/>
    <line x1="480" y1="60" x2="480" y2="240" stroke="#C7FF3D" stroke-width="1" stroke-dasharray="2 2"/>

    <!-- Floating Live Tooltip -->
    <rect x="495" y="40" width="90" height="40" fill="#171715" stroke="#C7FF3D" stroke-width="1"/>
    <text x="505" y="56" fill="#66655F" font-family="monospace" font-size="8">TICK [BTC/USD]</text>
    <text x="505" y="71" fill="#C7FF3D" font-family="monospace" font-size="11" font-weight="bold">+14.28%</text>
  </g>

  <!-- Metric Badges Row -->
  <g transform="translate(80, 370)">
    <rect width="180" height="50" fill="#171715" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="15" y="22" fill="#66655F" font-family="monospace" font-size="9">STREAM LATENCY</text>
    <text x="15" y="40" fill="#C7FF3D" font-family="monospace" font-size="14" font-weight="bold">&lt; 12ms LIVE</text>

    <rect x="210" width="180" height="50" fill="#171715" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="225" y="22" fill="#66655F" font-family="monospace" font-size="9">THROUGHPUT</text>
    <text x="225" y="40" fill="#F3F0E8" font-family="monospace" font-size="14" font-weight="bold">50k MSG / SEC</text>

    <rect x="420" width="180" height="50" fill="#171715" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="435" y="22" fill="#66655F" font-family="monospace" font-size="9">CANVAS RENDER</text>
    <text x="435" y="40" fill="#F3F0E8" font-family="monospace" font-size="14" font-weight="bold">60 FPS HARDWARE</text>
  </g>

  <!-- Footer -->
  <text x="40" y="480" fill="#66655F" font-family="monospace" font-size="10">REAL-TIME MARKET ANALYTICS PLATFORM</text>
  <text x="760" y="480" fill="#66655F" font-family="monospace" font-size="10" text-anchor="end">NEXT.JS / WEBSOCKETS / CANVAS API</text>
</svg>
